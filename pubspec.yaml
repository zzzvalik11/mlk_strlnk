name: telecom_dashboard
description: Личный кабинет телеком-абонента — Flutter Clean Architecture
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3

  # WebView (платёжная форма РСБ)
  webview_flutter: ^4.10.0

  # QR-код (СБП)
  qr_flutter: ^4.1.0

  # URL launcher (открыть qrUrl в браузере / банковском приложении)
  url_launcher: ^6.3.0

  # Environment variables from .env
  flutter_dotenv: ^5.2.1

  # Push notifications (Firebase Cloud Messaging)
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  fpdart: ^1.1.0

  # Local storage
  shared_preferences: ^2.2.3

  # Biometric auth
  local_auth: ^2.3.0

  # Utils / Localization
  intl: any

  flutter_localizations:
    sdk: flutter

  # Icons
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: any
  freezed: ^4.0.0
  json_serializable: any
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # .env for local dev (file is in .gitignore — safe for secrets)
    - .env


