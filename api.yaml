openapi: 3.0.3
info:
  title: Starlink — Личный кабинет абонента
  description: |
    API телеком-оператора для мобильного приложения личного кабинета.
    Аутентификация осуществляется via JWT Bearer Token.
    Токен получается при авторизации и действует 365 дней.

    ## Внешние интеграции
    Бэкенд выступает оркестратором между приложением и сторонними сервисами.
    Приложение напрямую не обращается к внешним сервисам.
    - **Платёжный шлюз**: Банк Русский Стандарт (RSB ECOMM v3.0.17)
    - **СБП**: Система быстрых платежей (SBP)
    - **Push-уведомления**: Firebase Cloud Messaging (FCM)
    - **SMS-шлюз**: Devino Telecom
    - **Биллинг**: Starlink BSS (starlink-api v1.0.0)
  version: 3.0.0
  contact:
    name: Starlink API Support

servers:
  - url: https://api.starlink.ru/api
    description: Production
  - url: http://10.0.2.2:3000/api
    description: Android Emulator (localhost)

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: Авторизация, OTP-верификация
  - name: Account
    description: Профиль абонента, балансы, счета
  - name: Payments
    description: Платёжный шлюз РСБ (RSB ECOMM), СБП, пополнение баланса
  - name: Transactions
    description: История транзакций из Биллинга
  - name: Services
    description: Услуги, тарифы, дополнительные услуги, пакеты
  - name: Bundles
    description: Пакеты предложений с тарифами
  - name: Support
    description: Обращения в техподдержку
  - name: Notifications
    description: Push-уведомления, SMS-уведомления
  - name: TariffTypes
    description: Типы тарифов

paths:
  # ============================================================
  # AUTH
  # ============================================================
  /v1/auth/token:
    post:
      tags: [Auth]
      summary: Авторизация абонента
      description: |
        Аутентификация по PIN и паролю. Возвращает JWT-токен, действительный 365 дней.
        Прокси-запрос к биллинговой системе Starlink BSS (POST /api/v1/auth/token).
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
            example:
              pin: '1234'
              password: 'secret123'
      responses:
        '200':
          description: Успешная авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                success: true
                data:
                  id: 12345
                  jwt: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                message: success
                code: 200
        '401':
          description: Неверные учётные данные
          content:
            application/json:
              example:
                detail: ''
                success: false
                message: incorrect username or password
                code: 401
        '429':
          description: Превышен лимит запросов
          content:
            application/json:
              example:
                detail: Rate limit exceeded

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Выход из системы
      description: |
        Инвалидирует текущий JWT-токен.
        Прокси-запрос к Starlink BSS (POST /api/v1/auth/logout).
      operationId: logout
      responses:
        '200':
          description: Успешный выход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              example:
                success: true
                message: success
                code: 200
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              example:
                detail: ''
                success: false
                message: not authenticated
                code: 401

  # ============================================================
  # ACCOUNT / SUBSCRIBER
  # ============================================================
  /v1/subscriber:
    get:
      tags: [Account]
      summary: Информация об абоненте
      description: |
        Возвращает профиль текущего авторизованного абонента.
        Прокси-запрос к Starlink BSS (GET /api/v1/subscriber).
      operationId: getSubscriber
      responses:
        '200':
          description: Профиль абонента
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/subscriber/accounts:
    get:
      tags: [Account]
      summary: Список счетов абонента
      description: |
        Возвращает все лицевые счета, привязанные к абоненту.
        Прокси-запрос к Starlink BSS (GET /api/v1/subscriber/accounts).
      operationId: getAccounts
      responses:
        '200':
          description: Список счетов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/subscriber/accounts/{account_id}:
    get:
      tags: [Account]
      summary: Информация по конкретному счёту
      description: |
        Возвращает детальную информацию по указанному лицевому счёту.
        Прокси-запрос к Starlink BSS.
      operationId: getAccountById
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Данные счёта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Счёт не найден
    patch:
      tags: [Account]
      summary: Обновление счёта
      description: |
        Блокировка/разблокировка счёта, установка обещанного платежа.
        Прокси-запрос к Starlink BSS (PATCH /api/v1/subscriber/accounts/{account_id}).
      operationId: updateAccount
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
      responses:
        '200':
          description: Счёт обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/subscriber/accounts/{account_id}/pay-link:
    get:
      tags: [Payments]
      summary: Ссылка на оплату
      description: |
        Возвращает платёжную ссылку (ссылку на платежную форму РСБ или СБП) для пополнения указанного счёта на заданную сумму.
        Формирует запрос к платёжному шлюзу РСБ ECOMM (команда `-v` для SMS-транзакции) или к СБП (POST /api/v1/create).
        Прокси-запрос к Starlink BSS.
      operationId: getPayLink
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: amount
          in: query
          required: true
          description: Сумма пополнения в рублях (копейки после точки)
          schema:
            type: number
            format: double
            example: 500.00
            minimum: 1
        - name: payment_method
          in: query
          required: false
          description: Метод оплаты
          schema:
            type: string
            enum: [card, sbp]
            default: card
      responses:
        '200':
          description: Платёжная ссылка
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CardPaymentLinkResponse'
                  - $ref: '#/components/schemas/SbpPaymentLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/subscriber/accounts/{account_id}/auto-payment-off:
    get:
      tags: [Payments]
      summary: Отключить автоплатёж
      description: |
        Отключает автоплатёж для указанного счёта.
        Прокси-запрос к Starlink BSS.
      operationId: disableAutoPayment
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Автоплатёж отключён
          content:
            application/json:
              example:
                success: true
                message: auto-payment disabled
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/subscriber/accounts/{account_id}/auto-payment-link:
    get:
      tags: [Payments]
      summary: Ссылка на подключение автоплатежа
      description: |
        Возвращает ссылку для подключения автоплатежа.
        Прокси-запрос к Starlink BSS.
      operationId: getAutoPaymentLink
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: amount
          in: query
          required: true
          description: Сумма автоплатежа
          schema:
            type: number
            format: double
            example: 500.00
      responses:
        '200':
          description: Ссылка на автоплатёж
          content:
            application/json:
              example:
                success: true
                auto_payment_link: 'https://...'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
  # PAYMENTS — РСБ ECOMM (CARD)
  # ============================================================
  /v1/payments/card/register:
    post:
      tags: [Payments]
      summary: Регистрация SMS-транзакции (РСБ)
      description: |
        Регистрирует единую транзакцию оплаты банковской картой через платёжный шлюз РСБ ECOMM.
        Формирует HTTP POST-запрос к Merchant Handler URL РСБ с командой `-v` (register SMS transaction).
        Аутентификация — через SSL-сертификат ТСП.
        В ответе возвращает `transaction_id` для перенаправления клиента на ClientHandler URL Банка.

        **Платёжные модели РСБ:**
        - SMS (команда -v): авторизация + выполнение за одну транзакцию
        - DMS (команда -a): авторизация → выполнение (команда -t) двумя этапами

        В данной реализации используется модель SMS.
      operationId: registerCardPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPaymentRegisterRequest'
            example:
              amount: 12300
              currency: '643'
              client_ip_addr: '10.0.20.30'
              description: 'Оплата заказа N123'
              mrch_transaction_id: 'order-uuid-001'
              language: ru
              server_version: '2.0'
      responses:
        '200':
          description: Транзакция зарегистрирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPaymentRegisterResponse'
              example:
                success: true
                transaction_id: 'rEsfhyIk8s9ypxkcS9fj/3C8FqA='
                client_handler_url: 'https://3dsecurepay.rsb.ru/ecomm2/ClientHandler?trans_id=rEsfhyIk8s9ypxkcS9fj%2F3C8FqA%3D'

  /v1/payments/card/status:
    post:
      tags: [Payments]
      summary: Статус транзакции (РСБ)
      description: |
        Запрашивает статус платёжной транзакции у шлюза РСБ ECOMM.
        Команда `-c` (get transaction result).
        Выполняется после перенаправления клиента с RETURN_URL.
        Жизненный цикл транзакции — 10 минут. Последующие запросы считаются избыточными.
      operationId: getCardPaymentStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPaymentStatusRequest'
            example:
              trans_id: 'rEsfhyIk8s9ypxkcS9fj/3C8FqA='
              client_ip_addr: '10.0.20.30'
              server_version: '2.0'
      responses:
        '200':
          description: Статус транзакции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPaymentStatusResponse'
              example:
                success: true
                result: OK
                result_ps: FINISHED
                result_code: '000'
                threedsecure: AUTHENTICATED
                rrn: '331711380059'
                approval_code: '327593'
                card_number: '5***********2372'
                mrch_transaction_id: 'order-uuid-001'

  /v1/payments/card/dms/register:
    post:
      tags: [Payments]
      summary: Регистрация DMS-авторизации (РСБ)
      description: |
        Регистрирует двухэтапную транзакцию (авторизация без списания) через платёжный шлюз РСБ ECOMM.
        Команда `-a`. Денежные средства блокируются на карте клиента.
        Для завершения списания необходимо вызвать `/v1/payments/card/dms/complete`.
      operationId: registerDmsAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPaymentRegisterRequest'
            example:
              amount: 12300
              currency: '643'
              client_ip_addr: '10.0.20.30'
              description: 'Заказ N123 (бронирование)'
              language: ru
              server_version: '2.0'
      responses:
        '200':
          description: DMS-авторизация зарегистрирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPaymentRegisterResponse'

  /v1/payments/card/dms/complete:
    post:
      tags: [Payments]
      summary: Выполнение DMS-транзакции (РСБ)
      description: |
        Завершает двухэтапную транзакцию — производит фактическое списание заблокированных средств.
        Команда `-t` (make DMS transaction).
        Вызывается после подтверждения от клиента (RETURN_URL).
      operationId: completeDmsTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DmsCompleteRequest'
            example:
              trans_id: 'rnSC7dvU73Wt9WTxE6TDXOeal/o='
              amount: 12300
              currency: '643'
              client_ip_addr: '10.0.20.30'
              description: 'Заказ N123'
              language: ru
      responses:
        '200':
          description: DMS-транзакция выполнена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmsCompleteResponse'
              example:
                success: true
                result: OK
                result_code: '000'
                rrn: '331813509357'
                approval_code: '864745'
                card_number: '5***********2372'

  /v1/payments/card/reverse:
    post:
      tags: [Payments]
      summary: Отмена транзакции (РСБ)
      description: |
        Отменяет транзакцию (reverse). Команда `-r`.
        Доступна до закрытия бизнес-дня.
        Для SMS и DMS-расчёта — полная сумма.
        Для DMS-авторизации — только полная сумма.
        После отмены средства возвращаются клиенту в течение дня.
      operationId: reverseCardPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionActionRequest'
            example:
              trans_id: 'HbetBxfr87TvObsevaRhAIdWWqM='
              suspected_fraud: false
      responses:
        '200':
          description: Транзакция отменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionActionResult'
              example:
                success: true
                result: OK
                result_code: '400'

  /v1/payments/card/refund:
    post:
      tags: [Payments]
      summary: Возврат средств (РСБ)
      description: |
        Возврат средств клиенту (refund). Команда `-k`.
        Самостоятельная операция с собственным transaction_id.
        Доступна после закрытия бизнес-дня.
        Поддерживается полный и частичный возврат.
        Общая сумма возвратов не может превышать сумму оригинальной транзакции.
      operationId: refundCardPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
            example:
              trans_id: 'M1pUcZowyEKaM5wrrlzyPbqDooU='
              amount: 50000
      responses:
        '200':
          description: Возврат выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponse'
              example:
                success: true
                result: OK
                result_code: '000'
                refund_trans_id: '6ru/d9kr9u1vtqATyNdlP8KX4Kc='

  /v1/payments/card/close-day:
    post:
      tags: [Payments]
      summary: Закрытие бизнес-дня (РСБ)
      description: |
        Инициирует процедуру закрытия бизнес-дня в платёжном шлюзе РСБ ECOMM.
        Команда `-b`. Необходимо выполнять 1 раз в сутки.
        По результатам Банк обрабатывает операции и перечисляет средства на расчётный счёт ТСП.
      operationId: closeBusinessDay
      responses:
        '200':
          description: Бизнес-день закрыт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseDayResponse'
              example:
                success: true
                result: OK
                result_code: '500'
                fld_075: '12'
                fld_076: '31'
                fld_087: '3201'
                fld_088: '10099'

  # ============================================================
  # PAYMENTS — СБП (SBP)
  # ============================================================
  /v1/payments/sbp/create:
    post:
      tags: [Payments]
      summary: Создание платежа СБП
      description: |
        Создаёт платёж через Систему быстрых платежей.
        Прокси-запрос к SBP API (POST /api/v1/create).
        В ответе возвращается платежная ссылка для генерации QR-кода и URL формы оплаты.
        Статусы платежа: CREATED → ON_PAYMENT → PAID / DECLINED / EXPIRED / REVERSED / REFUNDED.
      operationId: createSbpPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SbpCreateRequest'
            example:
              amount: 500.00
              account: '123456'
              phone: '79001234567'
              email: 'user@example.com'
              payment_stat: sbpStat
      responses:
        '201':
          description: Платёж СБП создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SbpCreateResponse'
              example:
                success: true
                sbp_id: 42
                rq_uid: 'uuid-550e8400'
                order_id: 'SBP-2024-000123'
                qrcode_link: 'https://qr.nspk.ru/...'
                qr_url: 'https://oplata.sberbank.ru/...'
                amount: '500.00'
                status: CREATED

  /v1/payments/sbp/status/{order_id}:
    get:
      tags: [Payments]
      summary: Статус платежа СБП
      description: |
        Возвращает текущий статус платежа СБП по order_id.
        Прокси-запрос к SBP API (GET /api/v1/status/{order_id}).
      operationId: getSbpPaymentStatus
      parameters:
        - name: order_id
          in: path
          required: true
          description: ID заказа в Сбербанке
          schema:
            type: string
          example: 'SBP-2024-000123'
      responses:
        '200':
          description: Статус платежа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SbpStatusResponse'

  /v1/payments/sbp/cancel/{order_id}:
    get:
      tags: [Payments]
      summary: Отмена платежа СБП
      description: |
        Отменяет платёж СБП в системе НСПК.
        Прокси-запрос к SBP API (GET /api/v1/cancel/{order_id}).
      operationId: cancelSbpPayment
      parameters:
        - name: order_id
          in: path
          required: true
          description: ID заказа в Сбербанке
          schema:
            type: string
      responses:
        '200':
          description: Платёж отменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SbpCancelResponse'

  /v1/payments/sbp/refund/{order_id}:
    post:
      tags: [Payments]
      summary: Возврат платежа СБП
      description: |
        Полный или частичный возврат платежа СБП.
        Прокси-запрос к SBP API (POST /api/v1/refund/{order_id}).
      operationId: refundSbpPayment
      parameters:
        - name: order_id
          in: path
          required: true
          description: ID заказа в Сбербанке
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SbpRefundRequest'
      responses:
        '200':
          description: Возврат выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SbpRefundResponse'

  /v1/payments/sbp/callback:
    post:
      tags: [Payments]
      summary: Callback от СБП
      description: |
        Обработка callback-уведомлений от Сбербанка/НСПК о смене статуса платежа СБП.
        Этот эндпоинт вызывается внешней системой, не требует JWT-авторизации.
      security: []
      operationId: sbpCallback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SbpCallbackData'
      responses:
        '200':
          description: Callback обработан
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
              example:
                status: accepted

  # ============================================================
  # TRANSACTIONS
  # ============================================================
  /v1/subscriber/accounts/{account_id}/transactions:
    post:
      tags: [Transactions]
      summary: История транзакций
      description: |
        Возвращает историю транзакций по лицевому счёту с фильтрацией по дате.
        Прокси-запрос к Starlink BSS (POST /api/v1/subscriber/accounts/{account_id}/transactions).
      operationId: getTransactionHistory
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionsRequest'
            example:
              date_from: '2024-01-01'
              date_to: '2024-12-31'
      responses:
        '200':
          description: Список транзакций
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date:
                      type: string
                      format: date-time
                      description: '2024-01-15T10:30:00'
                    amount:
                      type: number
                      description: 500.00
                    description:
                      type: string
                      description: 'Пополнение через СБП'
                    type:
                      type: string
                      enum: [credit, debit]
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
