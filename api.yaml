  # ============================================================
  # NOTIFICATIONS — PUSH (FCM)
  # ============================================================
  /v1/notifications/send:
    get:
      tags: [Notifications]
      summary: Отправка push-уведомлений
      description: |
        Инициирует отправку отложенных push-сообщений активным пользователям через Firebase Cloud Messaging (FCM).
        Backend обращается к FCM HTTP v1 API с серверным ключом.
        Прокси-запрос к Starlink BSS.
      operationId: sendPushNotifications
      responses:
        '200':
          description: Push-уведомления отправлены
          content:
            application/json:
              example:
                success: true
                message: 'push notifications sent to N users'

  /v1/notifications/status:
    get:
      tags: [Notifications]
      summary: Статус отправки push-уведомлений
      description: |
        Проверяет статус отправки push-сообщений через FCM.
        Прокси-запрос к Starlink BSS.
      operationId: getPushNotificationStatus
      responses:
        '200':
          description: Статус
          content:
            application/json:
              example:
                success: true
                pending: 5
                sent: 120
                failed: 2

  /v1/notifications/status-old:
    get:
      tags: [Notifications]
      summary: Статус старых push-уведомлений
      description: |
        Проверяет статус задержанных/старых push-сообщений.
        Прокси-запрос к Starlink BSS.
      operationId: getOldPushNotificationStatus
      responses:
        '200':
          description: Статус
          content:
            application/json:
              example:
                success: true
                pending: 0
                sent: 45
                failed: 1

  # ============================================================
  # SMS — DEVINO TELECOM
  # ============================================================
  /v1/sms/send:
    post:
      tags: [Notifications]
      summary: Отправка SMS (Devino Telecom)
      description: |
        Отправляет SMS-сообщение через шлюз Devino Telecom.
        Backend аутентифицируется в Devino по login:password (Basic Auth) и вызывает REST API:
        `POST https://integrationapi.net/v2/Send/SMS`.
        Сервис предназначен для отправки одноразовых паролей (OTP), уведомлений об оплате, информационных сообщений.
      operationId: sendSms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsSendRequest'
            example:
              phone: '79001234567'
              message: 'Ваш код подтверждения: 1234'
              sender: 'Starlink'
      responses:
        '200':
          description: SMS отправлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsSendResponse'
              example:
                success: true
                sms_id: 'MT-000000001'
                status: queued

  /v1/sms/status/{sms_id}:
    get:
      tags: [Notifications]
      summary: Статус SMS (Devino Telecom)
      description: |
        Проверяет статус доставки SMS-сообщения через Devino Telecom.
        Backend вызывает `GET https://integrationapi.net/v2/MessageState/{sms_id}`.
      operationId: getSmsStatus
      parameters:
        - name: sms_id
          in: path
          required: true
          description: ID SMS-сообщения, полученный при отправке
          schema:
            type: string
          example: 'MT-000000001'
      responses:
        '200':
          description: Статус SMS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsStatusResponse'
              example:
                success: true
                sms_id: 'MT-000000001'
                state: Delivered
                state_description: 'Доставлено'

  /v1/sms/balance:
    get:
      tags: [Notifications]
      summary: Баланс SMS-шлюза (Devino Telecom)
      description: |
        Возвращает текущий баланс аккаунта в системе Devino Telecom.
        Backend вызывает `GET https://integrationapi.net/v2/User/Balance`.
      operationId: getSmsBalance
      responses:
        '200':
          description: Баланс
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsBalanceResponse'
              example:
                success: true
                balance: 15420.50
                currency: RUR

