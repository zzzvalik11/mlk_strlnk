  # ============================================================
  # COMPONENTS
  # ============================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT-токен авторизации (действует 365 дней)'

  parameters:
    AccountId:
      name: account_id
      in: path
      required: true
      description: Идентификатор лицевого счёта
      schema:
        type: integer
      example: 123456

  responses:
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          example:
            detail: ''
            success: false
            message: not authenticated
            code: 401

  schemas:
    # --- Auth ---
    AuthRequest:
      type: object
      required: [pin, password]
      properties:
        pin:
          type: string
          maxLength: 10
          description: PIN-код абонента
          example: '1234'
        password:
          type: string
          maxLength: 128
          description: Пароль абонента
          example: 'secret123'

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            id:
              type: integer
              example: 12345
            jwt:
              type: string
              description: JWT-токен
              example: 'eyJhbGciOiJIUzI1NiIs...'
        message:
          type: string
        code:
          type: integer

    LogoutResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        code:
          type: integer

    # --- Account ---
    CustomerResponse:
      type: object
      description: Профиль абонента из биллинговой системы
      properties:
        id:
          type: integer
          example: 12345
        full_name:
          type: string
          example: 'Иванов И.И.'
        phone:
          type: string
          example: '79001234567'
        email:
          type: string
          example: 'user@example.com'
        address:
          type: string
          example: 'г. Москва, ул. Ленина, д.1, кв.10'

    AccountResponse:
      type: object
      description: Лицевой счёт абонента
      properties:
        id:
          type: integer
          example: 123456
        account_number:
          type: string
          example: 'LS-000123'
        balance:
          type: number
          example: -350.50
          description: Текущий баланс (может быть отрицательным)
        status:
          type: string
          enum: [active, blocked, suspended]
          example: active
        block_reason:
          type: string
          description: Причина блокировки (если заблокирован)
        has_auto_payment:
          type: boolean
          example: false
        auto_payment_amount:
          type: number
          example: 500.00

    AccountUpdateRequest:
      type: object
      properties:
        action:
          type: string
          enum: [block, unblock, set_promised_pay]
          description: Действие над счётом
        amount:
          type: number
          description: Сумма обещанного платежа (для set_promised_pay)
        reason:
          type: string
          description: Причина блокировки (для block)

    # --- Card Payment (RSB ECOMM) ---
    CardPaymentRegisterRequest:
      type: object
      required: [amount, currency, client_ip_addr]
      properties:
        amount:
          type: integer
          description: 'Сумма в копейках (последние 2 цифры — копейки)'
          example: 12300
          minimum: 1
          maximum: 999999999999
        currency:
          type: string
          description: 'Код валюты ISO 4217 (643 — рубль)'
          example: '643'
          maxLength: 3
        client_ip_addr:
          type: string
          description: 'IP-адрес клиента'
          example: '10.0.20.30'
          maxLength: 15
        description:
          type: string
          description: 'Описание платежа (UTF-8, латиница)'
          maxLength: 125
        mrch_transaction_id:
          type: string
          description: 'Уникальный ID транзакции мерчанта (UUID)'
          maxLength: 225
        language:
          type: string
          description: 'Язык платёжной страницы (ru/en)'
          enum: [ru, en]
        server_version:
          type: string
          description: 'Версия сервера ECOMM (2.0 — с доп. деталями)'
          example: '2.0'
        ecomm_payment_scenario:
          type: string
          description: 'Сценарий оплаты (10564 — СБП на странице Банка)'
          example: '10564'

    CardPaymentRegisterResponse:
      type: object
      properties:
        success:
          type: boolean
        transaction_id:
          type: string
          description: 'ID транзакции для ClientHandler URL'
          example: 'rEsfhyIk8s9ypxkcS9fj/3C8FqA='
        client_handler_url:
          type: string
          description: 'Полный URL для перенаправления клиента'
          example: 'https://3dsecurepay.rsb.ru/ecomm2/ClientHandler?trans_id=...'

    CardPaymentStatusRequest:
      type: object
      required: [trans_id, client_ip_addr]
      properties:
        trans_id:
          type: string
          description: 'Идентификатор транзакции'
          example: 'rEsfhyIk8s9ypxkcS9fj/3C8FqA='
          maxLength: 28
        client_ip_addr:
          type: string
          maxLength: 15
        server_version:
          type: string
          example: '2.0'

    CardPaymentStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        result:
          type: string
          description: 'OK / ERROR / REJECTED'
          example: OK
        result_ps:
          type: string
          description: 'FINISHED / ACTIVE / REVERSED'
          example: FINISHED
        result_code:
          type: string
          description: 'Код результата (000 — успех)'
          example: '000'
        threedsecure:
          type: string
          description: 'AUTHENTICATED / NOT_AUTHENTICATED / FAILED'
        rrn:
          type: string
          description: 'Retrieval Reference Number'
        approval_code:
          type: string
        card_number:
          type: string
          description: 'Маскированный номер карты'
        mrch_transaction_id:
          type: string
        type:
          type: string
          description: 'Тип операции (REFND для возврата)'
        iss_ccy:
          type: string
          description: 'Код страны эмитента'

    DmsCompleteRequest:
      type: object
      required: [trans_id, amount, currency, client_ip_addr]
      properties:
        trans_id:
          type: string
          description: 'ID авторизации (из register DMS)'
          maxLength: 28
        amount:
          type: integer
          description: 'Сумма списания в копейках'
        currency:
          type: string
          example: '643'
        client_ip_addr:
          type: string
          maxLength: 15
        description:
          type: string
        language:
          type: string

    DmsCompleteResponse:
      type: object
      properties:
        success:
          type: boolean
        result:
          type: string
        result_code:
          type: string
        rrn:
          type: string
        approval_code:
          type: string
        card_number:
          type: string

    TransactionActionRequest:
      type: object
      required: [trans_id]
      properties:
        trans_id:
          type: string
          maxLength: 28
        suspected_fraud:
          type: boolean
          description: 'Флаг подозрения в мошенничестве (yes)'
          default: false

    TransactionActionResult:
      type: object
      properties:
        success:
          type: boolean
        result:
          type: string
        result_code:
          type: string

    RefundRequest:
      type: object
      required: [trans_id]
      properties:
        trans_id:
          type: string
          maxLength: 28
          description: 'Идентификатор оригинальной транзакции'
        amount:
          type: integer
          description: 'Сумма возврата в копейках (необязательно — полный возврат)'

    RefundResponse:
      type: object
      properties:
        success:
          type: boolean
        result:
          type: string
        result_code:
          type: string
        refund_trans_id:
          type: string
          description: 'ID транзакции возврата'

    CloseDayResponse:
      type: object
      properties:
        success:
          type: boolean
        result:
          type: string
        result_code:
          type: string
        fld_075:
          type: string
          description: 'Количество авторизаций'
        fld_076:
          type: string
          description: 'Количество отказов'
        fld_087:
          type: string
          description: 'Сумма авторизаций'
        fld_088:
          type: string
          description: 'Сумма отказов'

    # --- SBP Payment ---
    SbpCreateRequest:
      type: object
      required: [amount, account]
      properties:
        amount:
          type: number
          description: 'Сумма платежа в рублях'
          example: 500.00
          exclusiveMinimum: 0
          maximum: 999999999999
        account:
          type: string
          description: 'Номер лицевого счёта'
          maxLength: 6
          example: '123456'
        phone:
          type: string
          description: 'Телефон плательщика'
          maxLength: 12
        email:
          type: string
          description: 'Email плательщика'
        payment_stat:
          type: string
          description: 'Источник платежа'
          default: sbpStat
          maxLength: 10

    SbpCreateResponse:
      type: object
      properties:
        success:
          type: boolean
        sbp_id:
          type: integer
          description: 'ID записи в PAY_SBP_LOG2'
        rq_uid:
          type: string
          description: 'Уникальный идентификатор запроса'
        order_id:
          type: string
          description: 'ID заказа в Сбербанке'
        qrcode_link:
          type: string
          description: 'Платёжная ссылка для QR-кода'
        qr_url:
          type: string
          description: 'URL формы оплаты'
        amount:
          type: string
        status:
          $ref: '#/components/schemas/PaymentState'

    SbpStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        sbp_id:
          type: integer
        rq_uid:
          type: string
        order_id:
          type: string
        status:
          $ref: '#/components/schemas/PaymentState'
        amount:
          type: string
        account:
          type: string
        created_at:
          type: string
          format: date-time
        operation_time:
          type: string
          format: date-time

    SbpCancelResponse:
      type: object
      properties:
        success:
          type: boolean
        sbp_id:
          type: integer
        order_id:
          type: string
        status:
          $ref: '#/components/schemas/PaymentState'
        message:
          type: string

    SbpRefundRequest:
      type: object
      properties:
        amount:
          type: number
          description: 'Сумма возврата (необязательно — полный возврат)'
          exclusiveMinimum: 0

    SbpRefundResponse:
      type: object
      properties:
        success:
          type: boolean
        sbp_id:
          type: integer
        order_id:
          type: string
        status:
          $ref: '#/components/schemas/PaymentState'
        refund_amount:
          type: string
        message:
          type: string

    SbpCallbackData:
      type: object
      required: [mdOrder, orderNumber, operation, status]
      properties:
        mdOrder:
          type: string
          description: 'Номер заказа в платёжном шлюзе'
          maxLength: 100
        orderNumber:
          type: string
          description: 'Номер заказа в системе партнёра'
          maxLength: 100
        operation:
          type: string
          description: 'Тип операции (deposited, approved, reversed)'
          maxLength: 50
        status:
          type: integer
          description: 'Статус: 0 — неуспешно, 1 — успешно'
          minimum: 0
          maximum: 10
        additionalParams:
          type: object
          description: 'Дополнительные параметры'

    PaymentState:
      type: string
      enum:
        - PAID
        - CREATED
        - REVERSED
        - REFUNDED
        - REVOKED
        - DECLINED
        - EXPIRED
        - AUTHORIZED
        - CONFIRMED
        - ON_PAYMENT
      description: 'Статус платежа СБП'

    # --- Card / SBP Payment Link ---
    CardPaymentLinkResponse:
      type: object
      properties:
        type:
          type: string
          example: card
        transaction_id:
          type: string
        client_handler_url:
          type: string
          description: 'URL платежной формы РСБ для ввода карты'

    SbpPaymentLinkResponse:
      type: object
      properties:
        type:
          type: string
          example: sbp
        qrcode_link:
          type: string
          description: 'Ссылка для генерации QR-кода СБП'
        qr_url:
          type: string
          description: 'URL формы оплаты СБП'
        order_id:
          type: string

    # --- Transactions ---
    TransactionsRequest:
      type: object
      properties:
        date_from:
          type: string
          format: date
          description: 'Начальная дата'
          example: '2024-01-01'
        date_to:
          type: string
          format: date
          description: 'Конечная дата'
          example: '2024-12-31'

    # --- Services ---
    ServiceItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [active, suspended]
        tariff:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            price:
              type: number

    ChangeServiceRequest:
      type: object
      properties:
        action:
          type: string
          enum: [change_tariff, suspend, unsuspend]
        tariff_id:
          type: integer
          description: 'ID нового тарифа (для change_tariff)'

    AdditionalServiceActionRequest:
      type: object
      properties:
        action:
          type: string
          enum: [connect, disconnect]

    # --- Bundles ---
    Bundle:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        is_active:
          type: boolean

    BundleDetailResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        is_active:
          type: boolean
        tariffs:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              price:
                type: number

    # --- Tariff Types ---
    TariffType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        is_enabled:
          type: boolean

    # --- Support ---
    SupportEmailRequest:
      type: object
      required: [subject, message]
      properties:
        subject:
          type: string
          description: 'Тема обращения'
        message:
          type: string
          description: 'Текст сообщения'

    # --- SMS (Devino Telecom) ---
    SmsSendRequest:
      type: object
      required: [phone, message]
      properties:
        phone:
          type: string
          description: 'Номер телефона получателя (формат 7XXXXXXXXXX)'
          example: '79001234567'
          pattern: '^7[0-9]{10}$'
        message:
          type: string
          description: 'Текст SMS-сообщения (макс. 1000 символов для кириллицы, 160 для латиницы в одном SMS)'
          maxLength: 1000
          example: 'Ваш код подтверждения: 1234'
        sender:
          type: string
          description: 'Имя отправителя (зарегистрированное в Devino)'
          default: 'Starlink'
          maxLength: 11
        send_date:
          type: string
          format: date-time
          description: 'Отложенная отправка (необязательно)'

    SmsSendResponse:
      type: object
      properties:
        success:
          type: boolean
        sms_id:
          type: string
          description: 'ID SMS в системе Devino (формат MT-XXXXXXXXX)'
        status:
          type: string
          description: 'Статус отправки (queued / accepted / error)'
        error:
          type: string
          description: 'Описание ошибки (при наличии)'

    SmsStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        sms_id:
          type: string
        state:
          type: string
          description: 'Состояние: Delivered / Sent / Expired / Undeliverable / Rejected'
        state_description:
          type: string
          description: 'Описание состояния на русском'

    SmsBalanceResponse:
      type: object
      properties:
        success:
          type: boolean
        balance:
          type: number
          description: 'Текущий баланс'
        currency:
          type: string
          description: 'Код валюты (RUR)'

    # --- Common ---
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'

    ValidationError:
      type: object
      properties:
        loc:
          type: array
          items:
            type: string
        msg:
          type: string
        type:
          type: string
