name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Ensure platform directories
        run: flutter create . --platforms=ios --project-name telecom_dashboard

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code (freezed / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      # ─── Вариант А: без подписи (только для тестирования) ───
      # Собирает .app для симулятора. Для реального устройства
      # нужны сертификаты (см. Вариант Б ниже).

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Create IPA from .app
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -r ../telecom_dashboard.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-nosign
          path: build/telecom_dashboard.ipa

