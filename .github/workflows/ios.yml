# ────────────────────────────────────────────────────────────────
# Build iOS IPA on push to main (requires macOS runner)
# ────────────────────────────────────────────────────────────────

name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter SDK version (e.g. 3.27.4)'
        required: false
        default: '3.27.4'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version || '3.27.4' }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate iOS platform files
        run: flutter create --platforms=ios .

      - name: Run build_runner (Freezed + json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods dependencies
        run: cd ios && pod install

      # ── Code Signing (optional) ─────────────────────────────
      # Uncomment and configure these steps when you have
      # Apple Developer account and signing certificates.
      #
      # Required secrets:
      #   IOS_CERTIFICATE_BASE64  — base64-encoded .p12 certificate
      #   IOS_CERTIFICATE_PASSWORD — password for the .p12 file
      #   IOS_PROVISIONING_PROFILE_BASE64 — base64-encoded .mobileprovision
      #
      # - name: Install Apple Certificate
      #   uses: apple-actions/import-codesign-certs@v2
      #   with:
      #     p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      #     p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      #
      # - name: Install Provisioning Profile
      #   run: |
      #     mkdir -p ~/Library/MobileDevice/Provisioning Profiles
      #     echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          mkdir -p build/ios/ipa
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload
          cd build/ios/ipa && zip -r ../../Starlink.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/Starlink.ipa
          retention-days: 30
