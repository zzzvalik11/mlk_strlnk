name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter SDK version (leave empty for latest stable)'
        required: false
        default: ''

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove stale generated files
        run: |
          find lib -name '*.freezed.dart' -delete 2>/dev/null || true
          find lib -name '*.g.dart' -delete 2>/dev/null || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version || '' }}
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate iOS platform files
        run: flutter create --platforms=ios,android .

      - name: Configure deep links
        run: bash scripts/configure_deep_links.sh

      # ── CocoaPods / Swift Package Manager ──────────────────
      # Flutter 3.47+ мигрирует на SPM. Если flutter create
      # сгенерировал Podfile — запускаем pod install.
      # Если нет (SPM) — пропускаем.
      - name: Install CocoaPods (if needed)
        run: |
          if [ -f ios/Podfile ]; then
            cd ios && pod install --repo-update
          else
            echo "No Podfile — using Swift Package Manager"
          fi

      - name: Run build_runner (Freezed + json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      # ── Code Signing ────────────────────────────────────────
      # Секреты: IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD,
      #   IOS_PROVISIONING_PROFILE_BASE64, IOS_TEAM_ID
      - name: Install Apple Certificate
        if: "${{ secrets.IOS_CERTIFICATE_BASE64 }}" != ""
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install Provisioning Profile
        if: "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" != ""
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Prepare ExportOptions.plist
        if: "${{ secrets.IOS_TEAM_ID }}" != ""
        run: |
          sed -i '' "s/\${TEAM_ID}/${{ secrets.IOS_TEAM_ID }}/g" ios/ExportOptions.plist

      # ── Build ────────────────────────────────────────────────
      # Если секреты заданы — билдим с подписью и создаём IPA.
      # Иначе — билдим без подписи (--no-codesign) для проверки компиляции.

      - name: Build iOS (no codesign — compilation check)
        if: "${{ secrets.IOS_CERTIFICATE_BASE64 }}" == ""
        run: flutter build ios --release --no-codesign

      - name: Build iOS (signed)
        if: "${{ secrets.IOS_CERTIFICATE_BASE64 }}" != ""
        run: |
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA
        if: "${{ secrets.IOS_CERTIFICATE_BASE64 }}" != ""
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30
