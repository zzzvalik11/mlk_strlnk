# ────────────────────────────────────────────────────────────────
# Build Android APK / AAB on push to main
# ────────────────────────────────────────────────────────────────

name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter SDK version (leave empty for latest stable)'
        required: false
        default: ''
      build_type:
        description: 'Build type'
        required: false
        default: 'apk'
        type: choice
        options:
          - apk
          - appbundle

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android platform files
        run: flutter create --platforms=android .

      # Java must be set up AFTER flutter create generates android/ with gradle files
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Run build_runner (Freezed + json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        if: ${{ github.event.inputs.build_type != 'appbundle' }}
        run: flutter build apk --release

      - name: Build App Bundle
        if: ${{ github.event.inputs.build_type == 'appbundle' }}
        run: flutter build appbundle --release

      - name: Upload APK
        if: ${{ github.event.inputs.build_type != 'appbundle' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload App Bundle
        if: ${{ github.event.inputs.build_type == 'appbundle' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
